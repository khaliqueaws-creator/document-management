apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: document-app
  template:
    metadata:
      labels:
        app: document-app
    spec:
      initContainers:
        - name: migrate
          image: docker.io/khalique/document-app:2.7.1-multi-turn-rag
          command:
            - /bin/sh
            - -c
            - |
              set -e
              python - <<'PY'
              import os
              import socket
              import time
              host = os.environ.get("DB_HOST", "postgresql")
              port = int(os.environ.get("DB_PORT", "5432"))
              
              deadline = time.time() + 120

              while time.time() < deadline:
                  try:
                      with socket.create_connection((host, port), timeout=5):
                          break
                  except OSError:
                      print(f"Waiting for database at {host}:{port}...")
                      time.sleep(5)
              else:
                  raise SystemExit(f"database was not reachable at {host}:{port} after 120 seconds")
              PY
              python manage.py migrate --noinput
          envFrom:
            - configMapRef:
                name: docmanager-config
            - secretRef:
                name: docmanager-secrets
          volumeMounts:
            - name: media
              mountPath: /app/media
      containers:
        - name: document-app
          image: docker.io/khalique/document-app:2.7.1-multi-turn-rag
          command:
            - gunicorn
            - docmanager.wsgi:application
            - --bind
            - 0.0.0.0:8000
            - --workers
            - "1"
            - --worker-tmp-dir
            - /tmp
            - --timeout
            - "60"
            - --access-logfile
            - "-"
            - --error-logfile
            - "-"
            - --capture-output
            - --log-level
            - info
          ports:
            - containerPort: 8000
          env:
            - name: HOME
              value: /tmp
          envFrom:
            - configMapRef:
                name: docmanager-config
            - secretRef:
                name: docmanager-secrets
          volumeMounts:
            - name: media
              mountPath: /app/media
          readinessProbe:
            httpGet:
              path: /healthz/
              port: 8000
              httpHeaders:
                - name: Host
                  value: document-app-document-app.apps-crc.testing
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz/
              port: 8000
              httpHeaders:
                - name: Host
                  value: document-app-document-app.apps-crc.testing
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: docmanager-media-pvc
