<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Document Portal{% endblock %}</title>

    <style>

        body {
            margin: 0;
            font-family: "IBM Plex Sans", Arial, sans-serif;
            background: #f4f4f4;
            color: #161616;
        }

        /* =========================
           TOP BAR
        ========================== */

        .topbar {
            height: 50px;
            background: #161616;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 22px;

            box-shadow: 0 2px 6px rgba(0,0,0,0.25);
        }

        .app-title {
            font-size: 18px;
            font-weight: 600;
        }

        .user-area {
            font-size: 14px;
            color: #e0e0e0;
        }

        /* =========================
           LAYOUT
        ========================== */

        .layout {
            display: flex;
            min-height: calc(100vh - 50px);
        }

        /* =========================
           SIDEBAR
        ========================== */

        .sidebar {
            width: 230px;
            background: #262626;
            color: white;
            padding-top: 20px;
        }

        .sidebar a {
            display: block;
            color: #c6c6c6;
            text-decoration: none;

            padding: 13px 22px;

            font-size: 15px;

            border-left: 4px solid transparent;

            transition: 0.2s;
        }

        .sidebar a:hover {
            background: #393939;
            color: white;
        }

        .sidebar a.active {
            background: #393939;
            color: white;
            border-left: 4px solid #0f62fe;
        }

        /* =========================
           MAIN CONTENT
        ========================== */

        .main {
            flex: 1;
            padding: 24px 30px;
        }

        .page-card {
            background: white;
            border: 1px solid #d0d0d0;

            padding: 24px;

            box-shadow: 0 1px 2px rgba(0,0,0,0.08);
        }

        h2 {
            margin-top: 0;
            font-weight: 500;
            color: #161616;
        }

        /* =========================
           FORM STYLING
        ========================== */

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .note {
            color: #525252;
            margin-bottom: 20px;
        }

        label {
            font-weight: 600;
            display: block;
            margin-top: 16px;
            color: #393939;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;

            border: 1px solid #8d8d8d;

            font-size: 14px;

            box-sizing: border-box;
        }

        textarea {
            min-height: 90px;
        }

        /* =========================
           BUTTONS
        ========================== */

        button,
        input[type="submit"] {

            background: #0f62fe;
            color: white;

            border: none;

            padding: 10px 18px;

            cursor: pointer;

            font-size: 14px;

            margin-top: 24px;

            transition: 0.2s;
        }

        button:hover,
        input[type="submit"]:hover {

            background: #0353e9;
        }

        /* =========================
           SEARCH PAGE
        ========================== */

        .search-box {

            display: grid;

            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));

            gap: 12px;

            margin-bottom: 25px;
        }

        /* =========================
           TABLES
        ========================== */

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {

            background: #2c3e50;

            color: white;

            padding: 10px;

            text-align: left;
        }

        td {

            padding: 10px;

            border-bottom: 1px solid #ddd;
        }

        table a {
            color: #0f62fe;
            text-decoration: none;
        }

        table a:hover {
            text-decoration: underline;
        }

        .empty {

            text-align: center;

            color: #777;

            padding: 20px;
        }

        /* =========================
           RESPONSIVE
        ========================== */

        @media (max-width: 768px) {

            .topbar {

                height: auto;

                padding: 12px 16px;

                flex-direction: column;

                align-items: flex-start;

                gap: 6px;
            }

            .layout {

                flex-direction: column;

                min-height: auto;
            }

            .sidebar {

                width: 100%;

                display: flex;

                overflow-x: auto;

                padding-top: 0;
            }

            .sidebar a {

                border-left: none;

                border-bottom: 4px solid transparent;

                white-space: nowrap;

                padding: 12px 16px;
            }

            .sidebar a.active {

                border-left: none;

                border-bottom: 4px solid #0f62fe;
            }

            .main {
                padding: 14px;
            }

            .page-card {
                padding: 16px;
            }

            .search-box {
                grid-template-columns: 1fr;
            }

            table {

                display: block;

                overflow-x: auto;

                white-space: nowrap;
            }

            .container {
                max-width: 100%;
            }
        }

    </style>
</head>

<body>

    <!-- TOP HEADER -->

    <div class="topbar">

        <div class="app-title">
            Document Navigator
        </div>

        <div class="user-area">
            Welcome, {{ request.session.user.name|default:"User" }}
        </div>

    </div>

    <!-- PAGE LAYOUT -->

    <div class="layout">

        <!-- LEFT SIDEBAR -->

        <div class="sidebar">

            <a href="/"
               class="{% if request.path == '/' %}active{% endif %}">
                Search Documents
            </a>

            <a href="/upload/"
               class="{% if request.path == '/upload/' %}active{% endif %}">
                Upload Document
            </a>
			{% if "DjangoLoader" in request.session.user.groups or "DjangoAdmin" in request.session.user.groups %}
			<a href="{% url 'upload' %}">
				<button>Upload Document</button>
			</a>

			<a href="{% url 'upload_scanned_image' %}">
				<button>Upload Scanned Image</button>
			</a>

			{% endif %}

            <a href="/logout/">
                Logout
            </a>

        </div>

        <!-- MAIN CONTENT -->

        <div class="main">

            <div class="page-card">

                {% block content %}
                {% endblock %}

            </div>

        </div>

    </div>

</body>
</html>
